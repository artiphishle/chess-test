name: Unit checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint --fix || true
      - run: bun run format
      - run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFileSync } from "node:fs";
            const paths = execFileSync("git", ["diff", "--name-only"]).toString("utf8").trim().split(String.fromCharCode(10)).filter(Boolean);
            for (const path of paths) console.log("CHESS_FORMAT:" + JSON.stringify({path,content:readFileSync(path,"utf8")}));
          '
      - run: bun run test
      - run: bun run check-types
      - run: bun run lint
      - run: bun run format:check
      - run: bun run knip:check
      - run: bun run build
