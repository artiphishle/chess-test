name: Temporary canonical formatting export
on:
  push:
    branches: [feat/game-commands-15]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format and export modified files
        run: |
          bun run format
          bun run lint --fix || true
          bun run format
          git diff --name-only | while read -r path; do
            echo "__FORMAT_START__${path}"
            sed 's/^/__FORMAT_LINE__/' "$path"
            echo "__FORMAT_END__${path}"
          done
